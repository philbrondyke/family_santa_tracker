*{box-sizing:border-box}

.sub{color:var(--gd);font-size:12px;letter-spacing:.12em}
#st{border:1px solid var(--g);padding:4px 10px;letter-spacing:.15em;font-size:12px}
main{max-width:1200px;margin:0 auto;padding:12px}
#mw{position:relative;overflow:hidden;border:1px solid var(--line);box-shadow:0 0 24px rgba(57,255,136,.15) inset}
#map{display:block;width:100%;height:auto}
.sweep{position:absolute;inset:-100%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 85%,rgba(57,255,136,.16) 100%);animation:spin 7s linear infinite}
#mw::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sweep{animation:none}}
.gr{stroke:var(--line);stroke-width:.6;opacity:.55}
.ring{fill:none;stroke:var(--gd);stroke-width:.7;stroke-dasharray:2 5;opacity:.5}
.land{fill:var(--land);stroke:var(--gd);stroke-width:.8}
.wat{fill:var(--sea);stroke:var(--gd);stroke-width:.6}
.lb{fill:none;stroke:var(--gd);stroke-width:1.4;stroke-dasharray:3 6;opacity:.7}
.lo{fill:none;stroke:var(--r);stroke-width:2.6;filter:url(#gl)}
.mk circle{fill:var(--sea);stroke:var(--g);stroke-width:2}
.mk.done circle{fill:var(--g)}
.mk.now circle{fill:var(--a);stroke:var(--a);filter:url(#gl)}
.mk text{fill:var(--g);font-size:var(--fs,13px);paint-order:stroke;stroke:var(--bg);stroke-width:3px;cursor:pointer}
.mk{cursor:pointer}
.hq rect{fill:var(--sea);stroke:var(--a);stroke-width:2.2}
.sg{fill:rgba(255,59,59,.25);stroke:var(--r);stroke-width:1.5}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button{background:var(--panel);color:var(--g);border:1px solid var(--g);font:inherit;letter-spacing:.1em;padding:8px 14px;cursor:pointer}
button:hover,button:focus-visible{background:var(--g);color:var(--bg);outline:none}
.grid{display:grid;grid-template-columns:minmax(240px,1fr) 2fr;gap:12px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.box{border:1px solid var(--line);background:var(--panel);padding:12px}
.box h2{margin:0 0 8px;font:600 13px Orbitron,'Courier New',monospace;letter-spacing:.15em;color:var(--a)}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line)}
.row b{color:#fff;font-weight:400;text-align:right}
ol{list-style:none;margin:0;padding:0;columns:2 280px;column-gap:16px}
li{padding:5px 6px;border-bottom:1px dotted var(--line);cursor:pointer;break-inside:avoid}
li:hover,li:focus-visible{background:rgba(57,255,136,.12);outline:none}
li.on{background:rgba(255,201,74,.16);color:#fff}
li.past{color:var(--gd)}
li[data-h]{opacity:.7;padding:3px 6px}
.hq.now rect{fill:var(--a)}
li.skip{cursor:default;color:var(--line)}
li.skip:hover{background:none}
li em{display:block;color:var(--gd);font-style:normal;font-size:12px;padding-left:4.2em}
li b{display:inline-block;width:4.2em;color:var(--a);font-weight:400}
.fine{color:var(--gd);font-size:11px;margin-top:10px;letter-spacing:.06em}
</style>

  $('bp').textContent=playing?'❚❚ HOLD':'▶ '+(end?'REPLAY':'LAUNCH')}
function go(j){prog=Math.max(0,Math.min(N-1,j));playing=false;upd()}
$('list').innerHTML=S.map((s,i)=>s.hq&&s.m!='FEB'&&s.m!='JUN'?'':(s.apr?'<li class="skip"><b>APR</b> NO FLIGHT PLAN FILED</li>':'')+'<li tabindex="0" data-i="'+i+'"'+(s.h?' data-h="1"':'')+'><b>'+s.m+'</b>'+s.n+(s.t&&!s.h?'<em>'+s.t+'</em>':'')+'</li>').join('');
document.querySelectorAll('#list li[data-i]').forEach(li=>{const f=()=>go(+li.dataset.i);li.onclick=f;li.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();f()}}});
$('bp').onclick=()=>{if(prog>=N-1)prog=0;playing=!playing;upd()};
$('bn').onclick=()=>go(Math.floor(prog+1e-6)+1);
$('bb').onclick=()=>go(Math.ceil(prog-1e-6)-1);
$('bv').onclick=()=>{vk=vk=='w'?'u':'w';$('bv').textContent='VIEW: '+(vk=='w'?'WORLD':'U.S. SECTOR');render()};
function frame(t){if(playing){prog+=(t-(last||t))/2400;if(prog>=N-1){prog=N-1;playing=false}}last=t;upd();requestAnimationFrame(frame)}
/* Jingle Bells (public domain) played as a synthesized piano */
const ND={C:0,D:2,E:4,F:5,G:7},Q=.32;
const A=[['E',1],['E',1],['E',2],['E',1],['E',1],['E',2],['E',1],['G',1],['C',1.5],['D',.5],['E',4],['F',1],['F',1],['F',1.5],['F',.5],['F',1],['E',1],['E',1],['E',.5],['E',.5],['E',1],['D',1],['D',1],['E',1],['D',2],['G',2]];
const B=[['E',1],['E',1],['E',2],['E',1],['E',1],['E',2],['E',1],['G',1],['C',1.5],['D',.5],['E',4],['F',1],['F',1],['F',1.5],['F',.5],['F',1],['E',1],['E',1],['E',.5],['E',.5],['G',1],['G',1],['F',1],['D',1],['C',4],['R',2]];
const MEL=A.concat(B);
let ac,mgn,tmr,mxi=0,nt=0,mon=false;
function bell(f,t,d){
  [[1,.55],[2,.28],[3,.14],[4,.07],[5,.03]].forEach(p=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f*p[0];
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p[1],t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+Math.min(d*Q*1.2+.9,2.2)/(1+p[0]*.3));
    o.connect(g);g.connect(mgn);o.start(t);o.stop(t+2.6)})}
function tick(t){const len=ac.sampleRate*.05|0,b=ac.createBuffer(1,len,ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<len;i++)x[i]=(Math.random()*2-1)*(1-i/len);
  const s=ac.createBufferSource(),h=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;h.type='highpass';h.frequency.value=6500;g.gain.value=.05;s.connect(h);h.connect(g);g.connect(mgn);s.start(t)}
function sched(){while(nt<ac.currentTime+.4){const n=MEL[mxi][0],d=MEL[mxi][1];
  if(n!='R'){bell(261.63*Math.pow(2,ND[n]/12),nt,d)}
  nt+=d*Q;mxi=(mxi+1)%MEL.length}}
function musicOn(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C();mgn=ac.createGain();mgn.gain.value=.15;mgn.connect(ac.destination)}
  ac.resume();mon=true;nt=ac.currentTime+.1;tmr=setInterval(sched,100)}
function musicOff(){mon=false;clearInterval(tmr);if(ac)ac.suspend()}
$('bm').onclick=()=>{mon?musicOff():musicOn();$('bm').textContent='♪ MUSIC: '+(mon?'ON':'OFF');$('bm').setAttribute('aria-pressed',mon)};
musicOn();$('bm').textContent='♪ MUSIC: ON';$('bm').setAttribute('aria-pressed','true');
if(ac&&ac.state!='running'){const EV=['pointerdown','keydown','touchend'],un=e=>{if(e.target.closest&&e.target.closest('#bm'))return;if(mon&&ac)ac.resume();EV.forEach(t=>document.removeEventListener(t,un,true))};EV.forEach(t=>document.addEventListener(t,un,true))}
render();requestAnimationFrame(frame);
</script>
